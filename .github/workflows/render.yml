name: Render IETF Draft

on:
  push:
    branches: [main]
    paths:
      - 'draft-divolt-smfps.xml'
      - '.github/workflows/render.yml'
  pull_request:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install xml2rfc
        run: pip install xml2rfc
      - name: Lint draft
        run: xml2rfc --no-dtd --v3 --lint draft-divolt-smfps.xml
      - name: Render text + HTML
        run: |
          mkdir -p rendered
          xml2rfc --text --out rendered/draft-divolt-smfps.txt  draft-divolt-smfps.xml
          xml2rfc --html --out rendered/draft-divolt-smfps.html draft-divolt-smfps.xml
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: rendered-drafts
          path: rendered/
